name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=8192
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Validate unsigned release tag
        env:
          MONGOG_RELEASE: '1'
        run: node scripts/validate-release-environment.mjs --platform darwin --tag "$RELEASE_TAG"
      - name: Build and verify unsigned E2E package
        run: |
          npm run package -- --platform=darwin --arch=${{ matrix.arch }}
          npm run verify:package -- --platform darwin --arch ${{ matrix.arch }}
          npm run test:e2e
      - name: Build hardened unsigned production package
        env:
          MONGOG_RELEASE: '1'
        run: npm run package -- --platform=darwin --arch=${{ matrix.arch }}
      - name: Make macOS ZIP
        env:
          MONGOG_RELEASE: '1'
        run: npm run make -- --skip-package --platform=darwin --arch=${{ matrix.arch }} --targets=@electron-forge/maker-zip
      - name: Make macOS DMG
        env:
          MONGOG_RELEASE: '1'
        shell: bash
        run: |
          node scripts/make-macos-dmg.mjs --arch ${{ matrix.arch }}
          DMG_PATH="$(find out/make -type f -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
      - name: Verify production package and architecture
        env:
          MONGOG_RELEASE: '1'
        shell: bash
        run: |
          npm run verify:package -- --platform darwin --arch ${{ matrix.arch }} --release
          APP_PATH="out/MongoG-darwin-${{ matrix.arch }}/MongoG.app"
          EXPECTED_MACHO_ARCH="${{ matrix.arch }}"
          if [[ "$EXPECTED_MACHO_ARCH" == "x64" ]]; then EXPECTED_MACHO_ARCH="x86_64"; fi
          lipo -archs "$APP_PATH/Contents/MacOS/MongoG" | tr ' ' '\n' | grep -Fxq "$EXPECTED_MACHO_ARCH"
      - name: Run production packaged smoke
        run: npm run smoke:packaged -- --platform darwin --arch ${{ matrix.arch }}
      - name: Normalize macOS artifacts
        run: npm run collect:release -- --platform darwin --arch ${{ matrix.arch }} --clean --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Windows native build toolchain
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - name: Validate unsigned release tag
        env:
          MONGOG_RELEASE: '1'
        run: node scripts/validate-release-environment.mjs --platform win32 --tag "$env:RELEASE_TAG"
      - name: Build and verify unsigned E2E package
        run: |
          npm run package -- --platform=win32 --arch=x64
          npm run verify:package -- --platform win32 --arch x64
          npm run test:e2e
      - name: Build hardened unsigned production artifacts
        env:
          MONGOG_RELEASE: '1'
        run: npm run make -- --platform=win32 --arch=x64
      - name: Verify production package
        env:
          MONGOG_RELEASE: '1'
        run: npm run verify:package -- --platform win32 --arch x64 --release
      - name: Run production packaged smoke
        run: npm run smoke:packaged -- --platform win32 --arch x64
      - name: Normalize Windows artifacts
        run: npm run collect:release -- --platform win32 --arch x64 --clean --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install packaging and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm xvfb
      - run: npm ci
      - name: Install Electron runtime libraries
        run: npx playwright install-deps
      - name: Validate release tag
        env:
          MONGOG_RELEASE: '1'
        run: node scripts/validate-release-environment.mjs --platform linux --tag "$RELEASE_TAG"
      - name: Build and verify unsigned E2E package
        run: |
          npm run package -- --platform=linux --arch=x64
          npm run verify:package -- --platform linux --arch x64
          xvfb-run -a npm run test:e2e
      - name: Build production artifacts
        env:
          MONGOG_RELEASE: '1'
        run: npm run make -- --platform=linux --arch=x64
      - name: Verify production package
        env:
          MONGOG_RELEASE: '1'
        run: npm run verify:package -- --platform linux --arch x64 --release
      - name: Configure packaged Electron SUID sandbox
        run: |
          sudo chown root:root out/MongoG-linux-x64/chrome-sandbox
          sudo chmod 4755 out/MongoG-linux-x64/chrome-sandbox
          stat -c '%U:%G %a %n' out/MongoG-linux-x64/chrome-sandbox
      - name: Run production packaged smoke
        run: xvfb-run -a npm run smoke:packaged -- --platform linux --arch x64
      - name: Normalize and inspect Linux artifacts
        run: |
          npm run collect:release -- --platform linux --arch x64 --clean --unsigned
          dpkg-deb --info release-artifacts/mongog_*.deb
          rpm -qip release-artifacts/mongog-*.rpm
      - name: Install, smoke, and remove the DEB package
        run: |
          sudo apt-get install -y ./release-artifacts/mongog_*.deb
          test -x /usr/bin/mongog
          MONGOG_PACKAGED_EXECUTABLE=/usr/bin/mongog xvfb-run -a npm run smoke:packaged -- --platform linux --arch x64
          sudo apt-get remove -y mongog
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-inputs
          merge-multiple: true
      - name: Verify the complete release set and create checksums
        run: node scripts/verify-release-assets.mjs --directory release-inputs --tag "$RELEASE_TAG" --unsigned
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          UNSIGNED_NOTICE="⚠️ UNSIGNED PRE-RELEASE: artifacts are not signed with Apple Developer ID or Windows Authenticode, and macOS artifacts are not notarized. Operating-system security warnings are expected. Verify downloads with SHA256SUMS.txt."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            test "$IS_DRAFT" = "true" || { echo "Refusing to replace an already published release."; exit 1; }
            gh release upload "$RELEASE_TAG" release-inputs/* --clobber
            gh release edit "$RELEASE_TAG" --prerelease --title "MongoG $RELEASE_TAG [UNSIGNED]"
          else
            gh release create "$RELEASE_TAG" release-inputs/* --draft --prerelease --verify-tag --generate-notes --notes "$UNSIGNED_NOTICE" --title "MongoG $RELEASE_TAG [UNSIGNED]"
          fi
