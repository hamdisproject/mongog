version: 2.1

parameters:
  run_release:
    type: boolean
    default: false
  release_tag:
    type: string
    default: ""

orbs:
  win: circleci/windows@4.1.1

executors:
  linux_node:
    docker:
      - image: cimg/node:22.13.0
    resource_class: medium
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
  linux_machine:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      NODE_OPTIONS: --max-old-space-size=6144
  macos_m4:
    macos:
      xcode: 26.6.0
    resource_class: m4pro.medium
    environment:
      NODE_OPTIONS: --max-old-space-size=8192

commands:
  restore_npm_cache:
    steps:
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - npm-v1-{{ arch }}-
  save_npm_cache:
    steps:
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
  install_node_unix:
    steps:
      - run:
          name: Install Node.js 22.13.0
          command: |
            case "$(uname -s)-$(uname -m)" in
              Darwin-arm64) NODE_DIST="darwin-arm64" ;;
              Darwin-x86_64) NODE_DIST="darwin-x64" ;;
              Linux-x86_64) NODE_DIST="linux-x64" ;;
              *) echo "Unsupported Node host: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
            esac
            NODE_ROOT="$HOME/.local/node-v22.13.0"
            curl --fail --location --retry 3 "https://nodejs.org/dist/v22.13.0/node-v22.13.0-${NODE_DIST}.tar.gz" -o /tmp/node.tar.gz
            mkdir -p "$NODE_ROOT"
            tar -xzf /tmp/node.tar.gz --strip-components=1 -C "$NODE_ROOT"
            echo "export PATH=$NODE_ROOT/bin:\$PATH" >> "$BASH_ENV"
            export PATH="$NODE_ROOT/bin:$PATH"
            node --version
            npm --version
  install_dependencies_unix:
    steps:
      - restore_npm_cache
      - run:
          name: Install npm dependencies
          command: npm ci --prefer-offline --no-audit
      - save_npm_cache
  install_windows_toolchain:
    steps:
      - run:
          name: Install Node.js and Python
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $ProgressPreference = 'SilentlyContinue'
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            function Get-VerifiedToolDownload([string]$Uri, [string]$Destination, [string]$Sha256) {
              for ($attempt = 1; $attempt -le 4; $attempt++) {
                try {
                  Invoke-WebRequest -UseBasicParsing -Uri $Uri -OutFile $Destination -TimeoutSec 120
                  break
                } catch {
                  Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
                  if ($attempt -eq 4) { throw }
                  Write-Warning "Tool download failed (attempt $attempt/4); retrying."
                  Start-Sleep -Seconds (5 * $attempt)
                }
              }
              if ((Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash -ne $Sha256) {
                Remove-Item -LiteralPath $Destination -Force
                throw "SHA-256 verification failed for $Uri"
              }
            }
            $nodeArchive = Join-Path $env:TEMP 'node-v22.13.0-win-x64.zip'
            $nodeRoot = 'C:\tools\node-v22.13.0'
            # Hash from https://nodejs.org/dist/v22.13.0/SHASUMS256.txt
            Get-VerifiedToolDownload 'https://nodejs.org/dist/v22.13.0/node-v22.13.0-win-x64.zip' $nodeArchive 'b0feb09ebf41328628e7383f7a092fb7342ce1e05c867a90cf8f1379205a8429'
            if (Test-Path $nodeRoot) { Remove-Item $nodeRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $nodeRoot | Out-Null
            Expand-Archive $nodeArchive -DestinationPath $env:TEMP -Force
            Move-Item (Join-Path $env:TEMP 'node-v22.13.0-win-x64\*') $nodeRoot -Force
            # The offline installer avoids Chocolatey's package feed entirely.
            $pythonInstaller = Join-Path $env:TEMP 'python-3.12.10-amd64.exe'
            $pythonRoot = 'C:\tools\Python312'
            # SHA-256 from the installer bundle published by Python.org (.exe.sigstore).
            Get-VerifiedToolDownload 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe' $pythonInstaller '67b5635e80ea51072b87941312d00ec8927c4db9ba18938f7ad2d27b328b95fb'
            $installer = Start-Process -FilePath $pythonInstaller -ArgumentList @(
              '/quiet', '/norestart', 'InstallAllUsers=0', "TargetDir=$pythonRoot",
              'PrependPath=0', 'Include_launcher=0', 'Include_pip=0', 'Include_test=0',
              'Include_doc=0', 'Include_tcltk=0', 'Shortcuts=0'
            ) -Wait -PassThru
            if ($installer.ExitCode -notin @(0, 3010)) {
              throw "Python installer failed with exit code $($installer.ExitCode)."
            }
            $python = Join-Path $pythonRoot 'python.exe'
            if (-not (Test-Path -LiteralPath $python)) { throw 'Python installer did not create the expected interpreter.' }
            & $python -c "import sys, struct; assert sys.version_info[:3] == (3, 12, 10); assert struct.calcsize('P') == 8; print(sys.version)"
            if ($LASTEXITCODE -ne 0) { throw 'Python 3.12.10 x64 verification failed.' }
            Add-Content $env:BASH_ENV 'export PATH="/c/tools/node-v22.13.0:$PATH"'
            Add-Content $env:BASH_ENV "export PYTHON='$($python -replace '\\','/')'"
            Add-Content $env:BASH_ENV "export npm_config_python='$($python -replace '\\','/')'"
            Add-Content $env:BASH_ENV "export npm_config_msvs_version='2022'"
            $env:PATH = "$nodeRoot;$env:PATH"
            node --version
            if ($LASTEXITCODE -ne 0) { throw 'Node.js verification failed.' }
            npm.cmd --version
            if ($LASTEXITCODE -ne 0) { throw 'npm verification failed.' }
  install_dependencies_windows:
    steps:
      - restore_npm_cache
      - run:
          name: Install npm dependencies
          shell: bash.exe
          command: |
            test "$(node --version)" = "v22.13.0"
            npm ci --prefer-offline --no-audit
      - save_npm_cache
  restore_mongodb_cache:
    steps:
      - restore_cache:
          keys:
            - mongodb-v1-{{ arch }}-{{ checksum "package-lock.json" }}
  save_mongodb_cache:
    steps:
      - save_cache:
          key: mongodb-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/mongodb-binaries
  select_release_tag_unix:
    steps:
      - run:
          name: Select and checkout release tag
          command: |
            RELEASE_TAG="${CIRCLE_TAG:-<< pipeline.parameters.release_tag >>}"
            test -n "$RELEASE_TAG" || { echo "release_tag is required for a manual release." >&2; exit 1; }
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git checkout --detach "$RELEASE_TAG"
            echo "export RELEASE_TAG='$RELEASE_TAG'" >> "$BASH_ENV"
  select_release_tag_windows:
    steps:
      - run:
          name: Select and checkout release tag
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $tag = if ($env:CIRCLE_TAG) { $env:CIRCLE_TAG } else { '<< pipeline.parameters.release_tag >>' }
            if (-not $tag) { throw 'release_tag is required for a manual release.' }
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            git checkout --detach $tag
            Add-Content $env:BASH_ENV "export RELEASE_TAG='$tag'"
  store_diagnostics:
    steps:
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: logs
          destination: logs

jobs:
  quality:
    executor: linux_node
    steps:
      - checkout
      - install_dependencies_unix
      - restore_mongodb_cache
      - run: { name: Typecheck, command: "npm run typecheck" }
      - run: { name: Lint, command: "npm run lint" }
      - run: { name: Unit tests, command: "npm test" }
      - run: { name: Integration tests, command: "npm run test:integ" }
      - save_mongodb_cache

  release_macos:
    parameters:
      arch: { type: enum, enum: [arm64, x64] }
    executor: macos_m4
    steps:
      - checkout
      - select_release_tag_unix
      - install_node_unix
      - install_dependencies_unix
      - restore_mongodb_cache
      - run:
          name: Validate signed release tag
          command: MONGOG_RELEASE=1 MONGOG_SIGN_RELEASE=1 node scripts/validate-release-environment.mjs --platform darwin --tag "$RELEASE_TAG"
      - run:
          name: Build and verify unsigned E2E package
          command: |
            npm run package -- --platform=darwin --arch=<< parameters.arch >>
            npm run verify:package -- --platform darwin --arch << parameters.arch >>
      - when:
          condition:
            equal: [arm64, << parameters.arch >>]
          steps:
            - run:
                name: Run packaged E2E on the native macOS architecture
                command: npm run test:e2e
      - run:
          name: Prepare ephemeral Apple signing keychain
          command: |
            SIGNING_DIRECTORY="$(mktemp -d /tmp/mongog-signing.XXXXXX)"
            node scripts/materialize-signing-assets.mjs --platform darwin --directory "$SIGNING_DIRECTORY"
            SIGNING_KEYCHAIN="$SIGNING_DIRECTORY/mongog-signing.keychain-db"
            security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$SIGNING_KEYCHAIN"
            security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
            security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$SIGNING_KEYCHAIN"
            security import "$SIGNING_DIRECTORY/mongog-release-certificate.p12" \
              -k "$SIGNING_KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$MACOS_CERTIFICATE_PASSWORD" "$SIGNING_KEYCHAIN"
            security list-keychains -d user -s "$SIGNING_KEYCHAIN"
            # Match @electron/osx-sign's identity lookup exactly so a missing
            # intermediate certificate cannot pass this guard.
            SIGNING_IDENTITIES="$(security find-identity -v "$SIGNING_KEYCHAIN")"
            [[ "$SIGNING_IDENTITIES" == *"$MACOS_SIGN_IDENTITY"* ]]
            echo "export MACOS_KEYCHAIN='$SIGNING_KEYCHAIN'" >> "$BASH_ENV"
            echo "export APPLE_API_KEY_PATH='$SIGNING_DIRECTORY/apple-api-key.p8'" >> "$BASH_ENV"
            echo "unset MACOS_CERTIFICATE_P12_BASE64 APPLE_API_KEY_P8_BASE64" >> "$BASH_ENV"
      - run:
          name: Build, sign, and notarize production package
          command: MONGOG_RELEASE=1 MONGOG_SIGN_RELEASE=1 npm run package -- --platform=darwin --arch=<< parameters.arch >>
      - run:
          name: Make macOS ZIP
          command: MONGOG_RELEASE=1 MONGOG_SIGN_RELEASE=1 npm run make -- --skip-package --platform=darwin --arch=<< parameters.arch >> --targets=@electron-forge/maker-zip
      - run:
          name: Make, notarize, staple, and verify macOS DMG
          command: |
            MONGOG_RELEASE=1 MONGOG_SIGN_RELEASE=1 node scripts/make-macos-dmg.mjs --arch << parameters.arch >>
            DMG_PATH="$(find out/make -type f -name '*.dmg' -print -quit)"
            test -n "$DMG_PATH"
            xcrun notarytool submit "$DMG_PATH" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "$DMG_PATH"
            xcrun stapler validate "$DMG_PATH"
            hdiutil verify "$DMG_PATH"
      - run:
          name: Verify signed production package and architecture
          command: |
            MONGOG_RELEASE=1 MONGOG_SIGN_RELEASE=1 npm run verify:package -- --platform darwin --arch << parameters.arch >> --release
            APP_PATH="out/MongoG-darwin-<< parameters.arch >>/MongoG.app"
            codesign --verify --deep --strict --verbose=4 "$APP_PATH"
            CODESIGN_DETAILS="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
            [[ "$CODESIGN_DETAILS" == *"Authority=$MACOS_SIGN_IDENTITY"* ]]
            spctl --assess --type execute --verbose=4 "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
            EXPECTED_MACHO_ARCH="<< parameters.arch >>"
            if [[ "$EXPECTED_MACHO_ARCH" == "x64" ]]; then EXPECTED_MACHO_ARCH="x86_64"; fi
            MACHO_ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/MongoG")"
            [[ " $MACHO_ARCHS " == *" $EXPECTED_MACHO_ARCH "* ]]
      - when:
          condition:
            equal: [arm64, << parameters.arch >>]
          steps:
            - run:
                name: Run production packaged smoke
                command: npm run smoke:packaged -- --platform darwin --arch arm64
      - run:
          name: Normalize macOS artifacts
          command: npm run collect:release -- --platform darwin --arch << parameters.arch >> --output "release-inputs/macos-<< parameters.arch >>" --clean
      - persist_to_workspace:
          root: .
          paths:
            - release-inputs/macos-<< parameters.arch >>
      - store_artifacts:
          path: release-inputs/macos-<< parameters.arch >>
          destination: release-macos-<< parameters.arch >>
      - store_diagnostics

  release_windows:
    executor: win/server-2022
    environment:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - checkout
      - select_release_tag_windows
      - install_windows_toolchain
      - install_dependencies_windows
      - restore_mongodb_cache
      - run:
          name: Validate unsigned release tag
          shell: bash.exe
          command: MONGOG_RELEASE=1 node scripts/validate-release-environment.mjs --platform win32 --tag "$RELEASE_TAG"
      - run:
          name: Build and verify unsigned E2E package
          shell: bash.exe
          command: |
            npm run prepackage
            ./node_modules/.bin/electron-forge package --platform=win32 --arch=x64
            npm run verify:package -- --platform win32 --arch x64
            npm run test:e2e
      - run:
          name: Build unsigned production app and NSIS installer
          shell: bash.exe
          command: |
            MONGOG_RELEASE=1 npm run package -- --platform=win32 --arch=x64
            MONGOG_RELEASE=1 npm run make:windows:nsis -- --platform win32 --arch x64
      - run:
          name: Verify Windows artifacts are unsigned
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $targets = @('out\MongoG-win32-x64\MongoG.exe')
            $installers = @(Get-ChildItem 'out\make\nsis\MongoG-Setup-*-win-x64.exe')
            if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
            $targets += $installers[0].FullName
            foreach ($target in $targets) {
              $signature = Get-AuthenticodeSignature -LiteralPath $target
              if ($signature.Status -ne 'NotSigned') {
                throw "Expected an unsigned Windows artifact: $target ($($signature.Status))"
              }
            }
      - run:
          name: Verify and smoke production package
          shell: bash.exe
          command: |
            MONGOG_RELEASE=1 npm run verify:package -- --platform win32 --arch x64 --release
            npm run smoke:packaged -- --platform win32 --arch x64
      - run:
          name: Normalize Windows artifacts
          shell: bash.exe
          command: npm run collect:release -- --platform win32 --arch x64 --output release-inputs/windows-x64 --clean --unsigned
      - persist_to_workspace:
          root: .
          paths:
            - release-inputs/windows-x64
      - store_artifacts:
          path: release-inputs/windows-x64
          destination: release-windows-x64
      - store_diagnostics

  release_linux:
    executor: linux_machine
    steps:
      - checkout
      - select_release_tag_unix
      - install_node_unix
      - run:
          name: Configure reliable Ubuntu package downloads
          command: |
            for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$source_file" ] || continue
              sudo sed -i -E \
                -e 's|https?://([a-z0-9-]+\.)?ec2\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|http://archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$source_file"
            done
            printf '%s\n' \
              'Acquire::Retries "4";' \
              'Acquire::http::Timeout "30";' \
              'Acquire::https::Timeout "30";' \
              | sudo tee /etc/apt/apt.conf.d/80-mongog-ci-network >/dev/null
      - run:
          name: Install packaging and display dependencies
          command: |
            sudo timeout --signal=TERM --kill-after=30s 15m apt-get update
            sudo timeout --signal=TERM --kill-after=30s 15m apt-get install -y fakeroot rpm xvfb
      - install_dependencies_unix
      - restore_mongodb_cache
      - run:
          name: Install Electron runtime libraries
          command: timeout --signal=TERM --kill-after=30s 15m npx playwright install-deps chromium
      - run:
          name: Validate release tag
          command: MONGOG_RELEASE=1 node scripts/validate-release-environment.mjs --platform linux --tag "$RELEASE_TAG"
      - run:
          name: Build and verify unsigned E2E package
          command: |
            npm run package -- --platform=linux --arch=x64
            npm run verify:package -- --platform linux --arch x64
            xvfb-run -a npm run test:e2e
      - run: { name: Build production RPM, command: "MONGOG_RELEASE=1 npm run make -- --platform=linux --arch=x64 --targets=@electron-forge/maker-rpm" }
      - run: { name: Verify production package, command: "MONGOG_RELEASE=1 npm run verify:package -- --platform linux --arch x64 --release" }
      - run:
          name: Configure packaged Electron SUID sandbox
          command: |
            sudo chown root:root out/MongoG-linux-x64/chrome-sandbox
            sudo chmod 4755 out/MongoG-linux-x64/chrome-sandbox
            stat -c '%U:%G %a %n' out/MongoG-linux-x64/chrome-sandbox
      - run: { name: Run production packaged smoke, command: "xvfb-run -a npm run smoke:packaged -- --platform linux --arch x64" }
      - run:
          name: Normalize and inspect Linux artifacts
          command: |
            PACKAGE_TYPE_PATH="out/MongoG-linux-x64/resources/package-type"
            test "$(cat "$PACKAGE_TYPE_PATH")" = "rpm"
            npm run collect:release -- --platform linux --arch x64 --output release-inputs/linux-x64 --clean
            RPM_PATH="$(compgen -G 'release-inputs/linux-x64/mongog-*.rpm')"
            rpm -qip "$RPM_PATH"
            RPM_CONTENTS="$(rpm -qlp "$RPM_PATH")"
            [[ "$RPM_CONTENTS" == *"/resources/package-type"* ]]
      - persist_to_workspace:
          root: .
          paths:
            - release-inputs/linux-x64
      - store_artifacts:
          path: release-inputs/linux-x64
          destination: release-linux-x64
      - store_diagnostics

  release_metadata:
    executor: linux_node
    steps:
      - checkout
      - select_release_tag_unix
      - attach_workspace:
          at: .
      - run:
          name: Verify release set and generate updater manifests
          command: |
            mkdir -p release-artifacts
            find release-inputs -type f -exec cp {} release-artifacts/ \;
            npm run verify:release -- --directory release-artifacts --tag "$RELEASE_TAG" --unsigned-windows
            npm run generate:update-manifests -- --directory release-artifacts --tag "$RELEASE_TAG"
      - store_artifacts:
          path: release-artifacts
          destination: release

workflows:
  ci:
    when: (not pipeline.git.tag) and (not pipeline.parameters.run_release)
    jobs:
      - quality

  release:
    when: pipeline.parameters.run_release or (pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/)
    jobs:
      - release_macos:
          name: release-macos-arm64
          arch: arm64
          context: release
          filters: pipeline.parameters.run_release or (pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/)
      - release_macos:
          name: release-macos-x64
          arch: x64
          context: release
          filters: pipeline.parameters.run_release or (pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/)
      - release_windows:
          name: release-windows-x64
          filters: pipeline.parameters.run_release or (pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/)
      - release_linux:
          name: release-linux-x64
          filters: pipeline.parameters.run_release or (pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/)
      - release_metadata:
          name: release-metadata
          requires:
            - release-macos-arm64
            - release-macos-x64
            - release-windows-x64
            - release-linux-x64
          filters: pipeline.parameters.run_release or (pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/)
